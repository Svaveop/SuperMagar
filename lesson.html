<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperMagar — Армянский</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <br>
  <div class="page">
    <div class="top-header fade-up">
      <div>
        <div class="logo">✦ SuperMagar ✦</div>
        <br> <br>
    <div class="daily-banner fade-up delay-1" style="margin:0 16px 24px;">
      <div class="daily-emoji">✨</div>
      <div>
        <div
          style="font-size:11px;color:var(--accent4);font-weight:600;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:4px;">
          Вырожение дня</div>
        <div class="daily-word">Ինչպե՞ս ես</div>
        <div class="daily-sub">Как дела? — (Ежедневный вопрос) 😊</div>
      </div>
    </div>

    <div class="section-title fade-up delay-2">Выбери с чего начать 👇</div>
    <div class="section-subtitle fade-up delay-2">Можешь выбрать любую последовательность</div>

    <div class="lesson-cards">
      <div class="lesson-card purple fade-up delay-2" data-card="words" onclick="openLesson('words')">
        <span class="lesson-card-icon">📖</span>
        <div class="lesson-card-title">Слова</div>
        <div class="lesson-card-desc">Новое слово + вырожение</div>
      </div>
      <div class="lesson-card teal fade-up delay-3" data-card="grammar" onclick="openLesson('grammar')">
        <span class="lesson-card-icon">✏️</span>
        <div class="lesson-card-title">Грамматика</div>
        <div class="lesson-card-desc">Структура + правило</div>
      </div>
      <div class="lesson-card red fade-up delay-3" data-card="conversation" onclick="openLesson('conversation')">
        <span class="lesson-card-icon">💬</span>
        <div class="lesson-card-title">Беседа</div>
        <div class="lesson-card-desc">Живой случай</div>
      </div>
      <div class="lesson-card gold fade-up delay-4" data-card="test" onclick="openLesson('test')">
        <span class="lesson-card-icon">⚡</span>
        <div class="lesson-card-title">Быстрый тест</div>
        <div class="lesson-card-desc">Проверь себя</div>
      </div>
    </div>

  <nav class="bnav">
    <a href="index.html" class="ni"><span class="ic">💬</span>Главная</a>
    <a href="lesson.html" class="ni-active"><span class="ic">📘</span>Уроки</a>
    <a href="extra.html" class="ni"><span class="ic">🎮</span>Игры</a>
  </nav>
  <script src="./app.js"></script>
</body>

</html>
