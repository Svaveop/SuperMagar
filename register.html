<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperMagar — Регистрация</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6d28d9, #a855f7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .register-form {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .register-form h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .register-form input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
        }

        .register-form button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            color: #6d28d9;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-form button:hover {
            transform: scale(1.02);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">SuperMagar</div>
        <p class="subtitle">Изучай языки легко и интересно</p>

        <form class="register-form">
            <h1>Регистрация</h1>

            <input type="text" placeholder="Имя пользователя" required>
            <input type="password" placeholder="Пароль" required>
            <input type="password" placeholder="Подтвердите пароль" required>

            <button type="submit">Зарегистрироваться</button>

            <p class="login-link">
                Уже есть аккаунт?
                <a href="#">Войти</a>
            </p>
        </form>
    </div>

</body>

</html>
